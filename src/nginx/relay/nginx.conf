load_module modules/ngx_stream_js_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

env RELAY_ID;
env RELAY_KEY;
env RELAY_ORIGIN;

events {
    worker_connections 16384;
}

stream {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    js_import relay from /etc/nginx/relay.js;
    js_set $origin relay.origin;
    js_set $attestation relay.attestation;

    # RPC traffic: TLS passes through untouched, so the relay never sees what it carries
    server {
        listen 443;
        listen [::]:443;
        proxy_pass $origin;
        proxy_connect_timeout 10s;
    }

    # Tells a client the IP the relay sees it from, signed with the relay's key
    server {
        listen 8443;
        listen [::]:8443;
        return $attestation;
    }
}
