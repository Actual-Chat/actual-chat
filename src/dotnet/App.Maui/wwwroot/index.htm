<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        img-src 'self'
            https://voxt.ai
            https://*.voxt.ai
            https://*.dev.voxt.ai
            https://*.local.voxt.ai
            https://*.dicebear.com
            https://*.boringavatars.com/
            https://i.ytimg.com
            https://static.klipy.com
            content: blob: data:;
        media-src 'self' https://voxt.ai https://*.voxt.ai content: blob: data:;
        style-src 'self' 'unsafe-inline';
        frame-src https://www.youtube.com/;
        object-src 'none';
        worker-src 'self' blob:;
        script-src 'self'
            'sha256-IWFoCSRBx0i01sF31ty8kSeDtD8PRi/efpTSg/fumWo='
            'sha256-zU2GIxfpzdHVMmYxjdLyOs4r4XWtc9oFoEFrwbxzdQg='
            https://www.youtube.com/iframe_api
            https://www.youtube.com/s/player/;
        connect-src 'self'
            https://voxt.ai
            https://*.voxt.ai
            https://*.dev.voxt.ai
            https://*.local.voxt.ai
            wss://voxt.ai
            wss://*.voxt.ai
            https://*.dicebear.com
            https://*.ingest.sentry.io
            https://firebaseinstallations.googleapis.com
            https://fcmregistrations.googleapis.com
            https://firebase.googleapis.com
            https://*.google-analytics.com/g/collect
            https://*.analytics.google.com/g/collect
            https://www.google.com/recaptcha/enterprise/clr;
        " />
    <title>Voxt</title>
    <base href="/" />
    <!-- A preload counts only if its href matches what @font-face requests, query string
         included. icon.woff2 is absent on purpose: icons.css appends a generated ?t=
         cache-buster that nothing here can reproduce, so it could never match. -->
    <link rel="preload" href="/dist/assets/woff2/TT-Commons-Pro-Regular.woff2" as="font" crossorigin />
    <link rel="preload" href="/dist/assets/woff2/TT-Commons-Pro-Medium.woff2" as="font" crossorigin />
    <link rel="preload" href="/dist/assets/woff2/TT-Commons-Pro-DemiBold.woff2" as="font" crossorigin />
    <link rel="prefetch" href="/dist/assets/woff2/TT-Commons-Pro-Light.woff2" as="font" crossorigin />
    <!-- Nothing else is prefetched here on purpose: workers, worklets and wasm are all served
         from the APK, so there is no network latency to hide (~15ms each), and they only
         competed with the first paint. -->
    <link href="/dist/bundle.css" rel="stylesheet" />
    <script src="_startup.js"></script>
</head>

<body class="app-mobile app-maui" style="background-color: #0C003D">
<div id="web-splash" class="web-splash"></div>
    <script src="websplash.js"></script>

    <div id="app" class="flex flex-col h-full"></div>

    <!-- This block must go right after app, otherwise page content won't be blurred -->
    <div id="components-reconnect-modal"></div>
    <div id="blazor-error-ui"></div>
    <div id="app-connection-state" class="reconnect-overlay" style="display: none"></div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script defer src="/dist/bundle.js" type="module"></script>
</body>
</html>
