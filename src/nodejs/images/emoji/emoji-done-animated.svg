<svg width="512" height="512" viewBox="-5 -5 38 38" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .rocking-group {
            transform-origin: 14px 26px;
            animation: swing-logic 4s infinite ease-in-out;
        }
        .shimmer-layer {
            animation: shimmer-sweep 4s infinite linear;
        }
        @keyframes swing-logic {
            0%, 50%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-8deg); }
            20% { transform: rotate(8deg); }
            30% { transform: rotate(-8deg); }
            40% { transform: rotate(8deg); }
        }
        @keyframes shimmer-sweep {
            0%, 55%   { transform: translateX(-28px) skewX(-15deg); opacity: 0; }
            60%       { opacity: 0; }
            70%       { opacity: 1; }
            85%       { transform: translateX(28px) skewX(-15deg); opacity: 1; }
            90%, 100% { transform: translateX(28px) skewX(-15deg); opacity: 0; }
        }
    </style>

    <defs>
        <linearGradient id="shimmer-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="white" stop-opacity="0" />
            <stop offset="50%"  stop-color="white" stop-opacity="0.8" />
            <stop offset="100%" stop-color="white" stop-opacity="0" />
        </linearGradient>

        <clipPath id="inner-box-clip">
            <path d="M5 9C5 6.79086 6.79086 5 9 5H21C23.2091 5 25 6.79086 25 9V21C25 23.2091 23.2091 25 21 25H9C6.79086 25 5 23.2091 5 21V9Z" />
        </clipPath>

        <linearGradient id="paint0_linear_26395_136050" x1="19.7619" y1="14.5238" x2="-4.52381" y2="-22.1429" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9EE172" />
            <stop offset="1" stop-color="#567B3E" />
        </linearGradient>
    </defs>

