<svg width="512" height="512" viewBox="-2 -4 32 34" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .character-dreamy {
            transform-origin: 14px 14px;
            animation: floatBreathe 5s infinite ease-in-out;
        }
        .eyes-group {
            transform-origin: 14px 11px;
            animation: slowBlink 6s infinite;
        }
        .mouth-group {
            transform-origin: 14px 18.5px;
            animation: softPulse 4s infinite ease-in-out;
        }
        .halo-group {
            transform-origin: 14px 10px;
            animation: haloFloat 4s infinite ease-in-out;
        }
        .hand-group {
            transform-origin: 7px 22px;
            animation: handSway 5s infinite ease-in-out;
        }
        @keyframes floatBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-2px) scale(1.03, 1.01); }
        }
        @keyframes slowBlink {
            0%, 94%, 100% { transform: scaleY(1); }
            97%           { transform: scaleY(0.1); }
        }
        @keyframes softPulse {
            0%, 100% { transform: scale(1);   opacity: 0.9; }
            50%      { transform: scale(1.1); opacity: 1; }
        }
        @keyframes haloFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-1.5px) rotate(3deg); }
        }
        @keyframes handSway {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            50%      { transform: rotate(-2deg) translateX(-0.5px); }
        }
    </style>

