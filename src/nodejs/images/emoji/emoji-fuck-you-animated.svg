<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Главный контейнер: отвечает за появление и исчезновение (scale) */
    .gesture-root {
      transform-origin: 14px 27px;
      animation: popInOut 4s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Группа покачивания: плавное движение влево-вправо */
    .sway-group {
      transform-origin: 14px 27px;
      animation: smoothSway 2s infinite ease-in-out;
    }

    /* Пульсация блика на ногте/пальце */
    .highlight {
      transform-origin: 13px 6px;
      animation: shine 2s infinite ease-in-out;
    }

    /* Анимация появления за 10% времени и ухода в конце */
    @keyframes popInOut {
      0% { transform: scale(0); opacity: 0; }
      8% { transform: scale(1.1); opacity: 1; } /* Небольшой отскок для эффекта стикера */
      10% { transform: scale(1); opacity: 1; }
      90% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Плавное покачивание */
    @keyframes smoothSway {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-0.5px); }
    }

    /* Эффект блеска */
    @keyframes shine {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>

