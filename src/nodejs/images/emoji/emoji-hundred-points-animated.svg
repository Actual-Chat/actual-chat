<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.sticker-body {
transform-origin: 14px 20px;
animation: elastic-bounce 2.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
code
Code
.eye-features {
  transform-origin: 14px 8px;
  animation: blink 3.5s infinite ease-in-out;
}

.expression-pulse {
  transform-origin: 14px 14px;
  animation: pulse-subtle 2.5s infinite ease-in-out;
}

@keyframes elastic-bounce {
  0%, 100% { transform: scale(1, 1) translateY(0); }
  15% { transform: scale(1.12, 0.88) translateY(0.5px); }
  30% { transform: scale(0.95, 1.05) translateY(-1.5px); }
  45% { transform: scale(1.03, 0.97) translateY(0); }
  60% { transform: scale(0.99, 1.01) translateY(-0.2px); }
}

@keyframes blink {
  0%, 90%, 100% { transform: scaleY(1); }
  93% { transform: scaleY(0.1); }
  96% { transform: scaleY(1.1); }
}

@keyframes pulse-subtle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.02); }
}
</style>
