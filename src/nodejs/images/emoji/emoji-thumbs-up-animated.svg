  <style>
    /* Все тело: резкий прыжок со сжатием и длинная пауза */
    .character-body {
      transform-origin: 14px 25px;
      animation: stickerBounce 2.5s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes stickerBounce {
      0% { transform: scale(1, 1) translateY(0); }
      7% { transform: scale(1.08, 0.93) translateY(0.3px); }
      15% { transform: scale(0.95, 1.08) translateY(-0.7px); }
      25% { transform: scale(1.03, 0.97) translateY(0); }
      35% { transform: scale(1, 1) translateY(0); }
      100% { transform: scale(1, 1) translateY(0); }
    }

  </style>

