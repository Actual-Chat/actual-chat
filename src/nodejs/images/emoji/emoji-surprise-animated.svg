<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Общая пульсация тела: одиночный цикл с паузой в пике */
    .character-root {
      transform-origin: 14px 14px;
      animation: single-pulse-hold 3s infinite ease-in-out;
    }

    /* Глаза: расширяются синхронно с телом */
    .eyes {
      transform-origin: 14px 11.6px;
      animation: eyes-expand-hold 3s infinite ease-in-out;
    }

    /* Рот: увеличивается сильнее остальных элементов */
    .mouth {
      transform-origin: 14px 20px;
      animation: mouth-joy-hold 3s infinite ease-in-out;
    }

    /* Брови: приподнимаются и удерживаются */
    .eyebrows {
      transform-origin: 14px 10px;
      animation: eyebrow-move-hold 3s infinite ease-in-out;
    }

    /* 
       Логика таймлайна (при 3с):
       0% - 10%: Увеличение (0.3с)
       10% - 26.6%: Удержание пика (0.5с)
       26.6% - 40%: Возврат (0.4с)
       40% - 100%: Покой
    */

    @keyframes single-pulse-hold {
      0%, 40%, 100% { transform: scale(1); }
      10%, 26.6% { transform: scale(1.06); }
    }

    @keyframes eyes-expand-hold {
      0%, 40%, 100% { transform: scale(1); }
      10%, 26.6% { transform: scale(1.12); }
    }

    @keyframes mouth-joy-hold {
      0%, 40%, 100% { transform: scale(1); }
      10%, 26.6% { transform: scale(1.18); }
    }

    @keyframes eyebrow-move-hold {
      0%, 40%, 100% { transform: translateY(0); }
      10%, 26.6% { transform: translateY(-0.7px); }
    }
  </style>

