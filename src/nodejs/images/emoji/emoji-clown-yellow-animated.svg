<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Весь персонаж: подпрыгивание и растяжение */
    .character-root {
      transform-origin: 14px 14px;
      animation: excited-wiggle 3s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
    }

    /* Волосы: подпрыгивание и легкое покачивание (независимо от тела) */
    .hair-group {
      transform-origin: 14px 10px;
      animation: hair-bounce 3s infinite ease-in-out;
    }

    /* Глаза: расширение и моргание */
    .eye-group {
      transform-origin: 14px 13.5px;
      animation: blink-wide 4s infinite ease-in-out;
    }

    /* Рот: вибрация (эффект смеха) */
    .mouth-group {
      transform-origin: 15px 21px;
      animation: laugh-shake 0.8s infinite ease-in-out;
    }

    /* Декор: парящие синие линии */
    .decor-lines {
      transform-origin: 14px 14px;
      animation: float-drift 2.5s infinite ease-in-out;
    }

    @keyframes excited-wiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      10% { transform: rotate(-8deg) scale(1.05, 0.95); }
      20% { transform: rotate(10deg) scale(0.95, 1.05); }
      30% { transform: rotate(-6deg) scale(1.02, 0.98); }
      40% { transform: rotate(4deg) scale(1); }
      50% { transform: rotate(0deg) scale(1); }
    }

    @keyframes hair-bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      15% { transform: translateY(-1.5px) rotate(-3deg); }
      30% { transform: translateY(0.5px) rotate(2deg); }
      45% { transform: translateY(-0.8px) rotate(-1deg); }
    }

    @keyframes blink-wide {
      0%, 40%, 60%, 100% { transform: scale(1, 1); }
      10%, 30% { transform: scale(1.1, 1.15); }
      50% { transform: scale(1, 0.1); }
    }

    @keyframes laugh-shake {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-0.4px) scale(1.05, 0.95); }
      75% { transform: translateX(0.4px) scale(1.05, 0.95); }
    }

    @keyframes float-drift {
      0%, 100% { transform: translateY(0) opacity(1); }
      50% { transform: translateY(-1.2px) opacity(0.6); }
    }
  </style>

