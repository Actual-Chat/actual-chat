    <style>
        .main-character {
            transform-origin: 14px 20px;
            animation: dislike-shake 2.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        .inner-lines {
            transform-origin: 14px 14px;
            animation: inner-drift 2.5s infinite ease-in-out;
        }
        @keyframes dislike-shake {
            0%, 45%, 100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            10% {
                transform: translateY(2.5px) rotate(-6deg) scale(1.05, 0.9);
            }
            20% {
                transform: translateY(-1px) rotate(2deg) scale(0.98, 1.05);
            }
            30% {
                transform: translateY(2.5px) rotate(-6deg) scale(1.05, 0.9);
            }
            40% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }
        @keyframes inner-drift {
            0%, 45%, 100% { transform: translate(0, 0); }
            10%, 30% { transform: translate(-0.3px, 0.5px); }
            20% { transform: translate(0.2px, -0.2px); }
        }
    </style>

