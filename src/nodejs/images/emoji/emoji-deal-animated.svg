  <style>
    .handshake {
      transform-origin: 14px 14px;
      animation: shake 1.4s ease-in-out infinite;
    }
    @keyframes shake {
      0%   { transform: translateY(0px)    scaleY(1.00); }
      20%  { transform: translateY(-1.5px) scaleY(0.94); }
      40%  { transform: translateY(1.3px)  scaleY(0.96); }
      60%  { transform: translateY(-1.0px) scaleY(0.97); }
      80%  { transform: translateY(0.6px)  scaleY(0.98); }
      90%  { transform: translateY(-0.2px) scaleY(0.99); }
      100% { transform: translateY(0px)    scaleY(1.00); }
    }
  </style>

