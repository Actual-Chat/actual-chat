<svg width="512" height="512" viewBox="0 0 28 28" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
  <style>
    .character {
      transform-origin: 14px 14px;
      animation: bodyBounce 2.4s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .eyes {
      transform-origin: 14px 13.5px;
      animation: blink 3.5s infinite ease-in-out;
    }
    .mouth {
      transform-origin: 14px 20.4px;
      animation: mouthPulse 2.4s infinite ease-in-out;
    }
    .ear-left {
      transform-origin: 2px 14px;
      animation: earWiggleLeft 2.4s infinite ease-in-out;
    }
    .ear-right {
      transform-origin: 26px 14px;
      animation: earWiggleRight 2.4s infinite ease-in-out;
    }
    .eyebrow {
      transform-origin: 14px 9px;
      animation: browRaise 2.4s infinite ease-in-out;
    }

    @keyframes bodyBounce {
      0%   { transform: scale(1, 1) translateY(0); }
      10%  { transform: scale(1.06, 0.94) translateY(1px); }
      25%  { transform: scale(0.95, 1.05) translateY(-1.5px); }
      40%  { transform: scale(1.03, 0.97) translateY(0.5px); }
      55%  { transform: scale(0.98, 1.02) translateY(-0.5px); }
      70%  { transform: scale(1.01, 0.99) translateY(0.2px); }
      100% { transform: scale(1, 1) translateY(0); }
    }

    @keyframes blink {
      0%, 85%, 100% { transform: scaleY(1); }
      90%            { transform: scaleY(0.08); }
      95%            { transform: scaleY(1); }
    }

    @keyframes mouthPulse {
      0%, 100% { transform: scale(1, 1); }
      10%      { transform: scale(1.05, 0.9); }
      25%      { transform: scale(0.96, 1.06); }
      55%      { transform: scale(1.02, 0.98); }
    }

    @keyframes earWiggleLeft {
      0%, 100% { transform: rotate(0deg); }
      10%      { transform: rotate(-4deg) translateX(-0.5px); }
      25%      { transform: rotate(3deg) translateX(0.3px); }
      55%      { transform: rotate(-1.5deg); }
    }

    @keyframes earWiggleRight {
      0%, 100% { transform: rotate(0deg); }
      10%      { transform: rotate(4deg) translateX(0.5px); }
      25%      { transform: rotate(-3deg) translateX(-0.3px); }
      55%      { transform: rotate(1.5deg); }
    }

    @keyframes browRaise {
      0%, 100% { transform: translateY(0); }
      10%      { transform: translateY(0.3px); }
      25%      { transform: translateY(-0.5px); }
      55%      { transform: translateY(-0.2px); }
    }
  </style>

