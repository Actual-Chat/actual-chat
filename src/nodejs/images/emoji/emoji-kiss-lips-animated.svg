<svg width="512" height="512" viewBox="-16 -18 60 50" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .sequence-root {
            transform-origin: 14px 14px;
            animation: popInOut 4s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .lips-pulse {
            transform-origin: 14px 14px;
            animation: lipsSubtleSync 4s infinite ease-in-out;
        }
        .heart {
            fill: #FF005C;
            opacity: 0;
            transform-origin: center;
        }
        .h1 {
            transform: translate(-3px, 0) scale(0.5);
            animation: heartFly 4s infinite 0.8s;
        }
        .h2 {
            transform: translate(0px, -1px) scale(0.5);
            animation: heartFly 4s infinite 1.4s;
        }
        .h3 {
            transform: translate(3px, 0) scale(0.5);
            animation: heartFly 4s infinite 2.0s;
        }
        @keyframes popInOut {
            0% { transform: scale(0); opacity: 0; }
            15% { transform: scale(1); opacity: 1; }
            85% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes lipsSubtleSync {
            0%, 15%, 85%, 100% { transform: scale(1); }
            25% { transform: scale(0.97); }
            35% { transform: scale(1); }
            45% { transform: scale(0.97); }
            55% { transform: scale(1); }
            65% { transform: scale(0.97); }
            75% { transform: scale(1); }
        }
        @keyframes heartFly {
            0% { opacity: 0; transform: translate(var(--sx, 0), var(--sy, 0)) scale(0); }
            10% { opacity: 1; transform: translate(var(--sx, 0), calc(var(--sy, 0) - 2px)) scale(0.5); }
            60% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.8) rotate(var(--tr)); }
            100% { opacity: 0; }
        }
    </style>

