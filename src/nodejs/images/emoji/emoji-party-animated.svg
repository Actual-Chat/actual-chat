<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Анимация корпуса стаканчика: подготовка и резкий выстрел */
    .popper-cup {
      transform-origin: 8px 22px;
      animation: cup-action 2.5s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Анимация вылета конфетти: короткий полет и растворение */
    .confetti-action {
      transform-origin: 18px 10px;
      animation: burst-short 2.5s infinite ease-out;
    }

    @keyframes cup-action {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); } /* Увеличение перед выстрелом */
      20% { transform: scale(0.95); }  /* Сжатие в момент вылета */
      28% { transform: scale(1.05); }  /* Отдача */
      40% { transform: scale(1); }
    }

    @keyframes burst-short {
      0%, 19% { 
        transform: translate(0, 0) scale(0); 
        opacity: 0; 
      }
      22% { 
        transform: translate(0, 0) scale(0.6); 
        opacity: 1; 
      }
      /* Ограниченный разлет */
      55% { 
        transform: translate(4px, -6px) scale(1); 
        opacity: 1; 
      }
      80%, 100% { 
        transform: translate(5px, -7px) scale(1.05); 
        opacity: 0; 
      }
    }
  </style>

