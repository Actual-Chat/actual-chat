<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* Character Body: Peaceful floating and breathing */
.character-body {
transform-origin: 14px 13px;
animation: bodyFloat 4s infinite ease-in-out;
}
code
Code
/* Eyes: Slow, gentle blinks */
.eyes {
  transform-origin: 14px 10px;
  animation: slowBlink 5s infinite ease-in-out;
}

/* Hands: Subtle hugging/patting motion */
.hand-left {
  transform-origin: 7px 22px;
  animation: hugLeft 4s infinite ease-in-out;
}
.hand-right {
  transform-origin: 21px 22px;
  animation: hugRight 4s infinite ease-in-out;
}

/* Mouth/Smile: Subtle pulse */
.expression-mouth {
  transform-origin: 14px 16px;
  animation: mouthPulse 4s infinite ease-in-out;
}

/* Keyframes */
@keyframes bodyFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-0.6px) scale(1.02, 0.98); }
}

@keyframes slowBlink {
  0%, 90%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.1); }
}

@keyframes hugLeft {
  0%, 100% { transform: rotate(0deg) translate(0, 0); }
  50% { transform: rotate(-3deg) translate(-0.5px, -0.5px); }
}

@keyframes hugRight {
  0%, 100% { transform: rotate(0deg) translate(0, 0); }
  50% { transform: rotate(3deg) translate(0.5px, -0.5px); }
}

@keyframes mouthPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05, 0.95); }
}
</style>
