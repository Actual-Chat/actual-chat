<svg width="512" height="512" viewBox="-2 -2 32 32" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .character-root {
            transform-origin: 14px 14px;
            animation: gentle-breathe 4s infinite ease-in-out;
        }
        .hair-left {
            transform-origin: 6px 5px;
            animation: hair-bounce 2s infinite ease-in-out;
        }
        .hair-right {
            transform-origin: 22px 5px;
            animation: hair-bounce 2s infinite ease-in-out -1s;
        }
        .brows {
            transform-origin: 14px 10px;
            animation: brows-sway 3s infinite ease-in-out;
        }
        .eyes {
            transform-origin: 14px 13px;
            animation: blink 4s infinite;
        }
        .nose {
            transform-origin: 14.5px 15.5px;
            animation: nose-beat 2s infinite ease-in-out;
        }
        @keyframes gentle-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.3px); }
        }
        @keyframes hair-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-1.5px) rotate(-3deg); }
        }
        @keyframes brows-sway {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.6px); }
        }
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        @keyframes nose-beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>

