<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Основное тело: мягкое "дыхание" персонажа */
    .body-master {
      transform-origin: 14px 14px;
      animation: body-pulse 1.2s infinite ease-in-out;
    }

    /* Ритм смеха: общая вертикальная вибрация для всех элементов лица */
    .laugh-vibration {
      animation: laugh-bounce 0.12s infinite alternate ease-in-out;
    }

    /* Глаза: моргание + вибрация (через запятую применяем две анимации) */
    .eye-group {
      transform-origin: 14px 13px;
      animation: 
        blink 4s infinite, 
        laugh-bounce 0.12s infinite alternate ease-in-out;
    }

    .mouth-group { transform-origin: 14px 21px; }
    .tear-group { transform-origin: 14px 19px; }

    /* Keyframes для вибрации (вверх-вниз) */
    @keyframes laugh-bounce {
      from { transform: translateY(0); }
      to { transform: translateY(0.5px); }
    }

    /* Keyframes для дыхания тела */
    @keyframes body-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02, 0.98); }
    }

    /* Keyframes для моргания */
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
  </style>

