<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.character-wiggle {
transform-origin: 14px 14px;
animation: excited-wiggle 2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
code
Code
.eyes-blink {
  transform-origin: 14px 12px;
  animation: eye-expression 3s infinite ease-in-out;
}

.mouth-shake {
  transform-origin: 14px 21px;
  animation: laugh-shake 0.4s infinite ease-in-out;
}

@keyframes excited-wiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  20% { transform: rotate(-10deg) scale(1.05, 0.95); }
  40% { transform: rotate(8deg) scale(0.98, 1.02); }
  60% { transform: rotate(-5deg) scale(1.03, 0.97); }
  80% { transform: rotate(3deg) scale(0.99, 1.01); }
}

@keyframes eye-expression {
  0%, 45%, 65%, 100% { transform: scale(1); }
  50% { transform: scale(1.2, 1.2); } /* Wide eyes */
  55% { transform: scale(1.2, 0.1); } /* Blink */
  60% { transform: scale(1.2, 1.2); } /* Wide again */
}

@keyframes laugh-shake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(0.3px, -0.2px); }
  75% { transform: translate(-0.3px, 0.2px); }
}
</style>
