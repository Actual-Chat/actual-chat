<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.character-wiggle {
transform-origin: 14px 14px;
animation: wiggle 2.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
code
Code
.eyes-blink {
  transform-origin: 14px 14px;
  animation: eye-logic 3s infinite ease-in-out;
}

.mouth-shake {
  transform-origin: 14px 18px;
  animation: laugh-shake 0.4s infinite ease-in-out;
}

.horns-float {
  transform-origin: 14px 6px;
  animation: horn-float 2s infinite ease-in-out;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  15% { transform: rotate(-10deg) scale(1.05, 0.95); }
  30% { transform: rotate(10deg) scale(0.98, 1.02); }
  45% { transform: rotate(-6deg) scale(1.02, 0.98); }
  60% { transform: rotate(4deg) scale(0.99, 1.01); }
  75% { transform: rotate(-2deg) scale(1); }
}

@keyframes eye-logic {
  0%, 75%, 100% { transform: scale(1); }
  80% { transform: scale(1.15, 1.15); } /* Wide eyes */
  85% { transform: scale(1.15, 0.1); }  /* Blink */
  90% { transform: scale(1.15, 1.15); } /* Open wide */
}

@keyframes laugh-shake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(0.3px, -0.2px); }
  75% { transform: translate(-0.3px, 0.2px); }
}

@keyframes horn-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-1px); }
}
</style>
