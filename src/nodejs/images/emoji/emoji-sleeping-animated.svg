<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Главный контейнер: медленное парение вверх-вниз */
    .sticker-root {
      transform-origin: 14px 14px;
      animation: mainFloat 5s infinite ease-in-out;
    }
    
    /* Тело: очень мягкое дыхание (чуть расширяется и сужается) */
    .face-body {
      transform-origin: 14px 15px;
      animation: breathe 5s infinite ease-in-out;
    }

    /* Глаза: едва заметное подрагивание во сне (не полное моргание) */
    .eyes {
      transform-origin: 14px 14px;
      animation: sleepTwitch 7s infinite ease-in-out;
    }

    /* Рот: пульсация в такт дыханию */
    .mouth {
      transform-origin: 14px 22px;
      animation: mouthPulse 5s infinite ease-in-out;
    }

    /* Буквы Z: плавное всплытие по диагонали с покачиванием */
    .decor-z {
      transform-origin: 22px 5px;
      animation: floatingZZZ 6s infinite ease-in-out;
    }

    @keyframes mainFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.6px); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02, 0.99); }
    }

    @keyframes sleepTwitch {
      0%, 90%, 100% { transform: scaleY(1); opacity: 1; }
      93%, 97% { transform: scaleY(0.92); opacity: 0.9; }
      95% { transform: scaleY(1.05); }
    }

    @keyframes mouthPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes floatingZZZ {
      0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
      50% { transform: translate(1.5px, -2px) rotate(5deg); opacity: 1; }
    }
  </style>

