<svg width="512" height="512" viewBox="0 0 28 28" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
<style>
.character-master {
transform-origin: 14px 14px;
animation: characterBounce 1.5s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
}
.star-eyes {
transform-origin: 14px 9px;
animation: starBlink 3s infinite ease-in-out;
}
.mouth-group {
transform-origin: 14px 20px;
animation: mouthPulse 1.5s infinite ease-in-out;
}
.brow-line {
transform-origin: 14px 11px;
animation: browMove 1.5s infinite ease-in-out;
}
code
Code
@keyframes characterBounce {
  0%, 100% { transform: scale(1) translateY(0); }
  30% { transform: scale(1.08, 0.92) translateY(0.3px); }
  60% { transform: scale(0.96, 1.04) translateY(-0.5px); }
  85% { transform: scale(1.02, 0.98) translateY(0); }
}

@keyframes starBlink {
  0%, 90%, 100% { transform: scaleY(1); opacity: 1; }
  95% { transform: scaleY(0.1); opacity: 0.8; }
}

@keyframes mouthPulse {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.05, 0.95); }
  60% { transform: scale(0.98, 1.02); }
}

@keyframes browMove {
  0%, 100% { transform: translateY(0); }
  30% { transform: translateY(0.4px); }
  60% { transform: translateY(-0.2px); }
}
</style>
