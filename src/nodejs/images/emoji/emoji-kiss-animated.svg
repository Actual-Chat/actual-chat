<svg width="512" height="512" viewBox="-2 -3 34 32" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .mouth-heart-main {
            transform-origin: 20px 17px;
            animation: heartFlySequence 4s infinite ease-in-out;
            opacity: 0;
        }
        .brows-eyes-move {
            transform-origin: 14px 10px;
            animation: browsSync 4s infinite ease-in-out;
        }
        @keyframes heartFlySequence {
            0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
            5%   { transform: translate(0, 0) scale(1); opacity: 1; }
            25%  { transform: translate(4px, -15px) scale(1.6); opacity: 0; }

            33%  { transform: translate(0, 0) scale(0.5); opacity: 0; }
            38%  { transform: translate(0, 0) scale(1); opacity: 1; }
            58%  { transform: translate(4px, -15px) scale(1.6); opacity: 0; }

            66%  { transform: translate(0, 0) scale(0.5); opacity: 0; }
            71%  { transform: translate(0, 0) scale(1); opacity: 1; }
            91%  { transform: translate(4px, -15px) scale(1.6); opacity: 0; }

            100% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        }
        @keyframes browsSync {
            0%, 30%, 33%, 63%, 66%, 96%, 100% { transform: translateY(0); }
            10%, 43%, 76% { transform: translateY(-1.2px); }
        }
    </style>

