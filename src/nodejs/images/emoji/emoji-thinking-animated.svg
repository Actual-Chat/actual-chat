<style>
.character-master {
transform-origin: 14px 14px;
animation: wobble 4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
code
Code
.eyes-group {
  transform-origin: 14px 11px;
  animation: blink 4s linear infinite;
}

.mouth-group {
  transform-origin: 14.5px 15.5px;
  animation: mouthPulse 3s ease-in-out infinite;
}

.hand-group {
  transform-origin: 6px 22px;
  animation: handFloat 2.5s ease-in-out infinite;
}

@keyframes wobble {
  0%, 100% { transform: rotate(-4deg) translateY(0); }
  50% { transform: rotate(4deg) translateY(-0.5px); }
}

@keyframes blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}

@keyframes mouthPulse {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(1.1); }
}

@keyframes handFloat {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  50% { transform: translate(-0.3px, 0.5px) rotate(-2deg); }
}
</style>
