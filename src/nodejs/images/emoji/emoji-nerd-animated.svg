<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .character {
      transform-origin: 14px 14px;
      animation: laugh 1.6s infinite cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    .mouth-group {
      transform-origin: 14px 19px;
      animation: mouthShake 1.6s infinite ease-in-out;
    }
    .dots-left {
      transform-origin: 9px 21px;
      animation: dotFloat 1.6s infinite ease-in-out;
    }
    .dots-right {
      transform-origin: 23px 17px;
      animation: dotFloat 1.6s 0.2s infinite ease-in-out;
    }

    @keyframes laugh {
      0%   { transform: rotate(0deg) scale(1); }
      10%  { transform: rotate(-8deg) scale(1.06, 0.94); }
      20%  { transform: rotate(7deg) scale(0.95, 1.05); }
      30%  { transform: rotate(-6deg) scale(1.04, 0.96); }
      40%  { transform: rotate(5deg) scale(0.97, 1.03); }
      50%  { transform: rotate(-3deg) scale(1.02, 0.98); }
      60%  { transform: rotate(2deg) scale(0.99, 1.01); }
      70%  { transform: rotate(-1deg) scale(1.01, 0.99); }
      85%  { transform: rotate(0.5deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes mouthShake {
      0%   { transform: translateX(0) rotate(0deg); }
      10%  { transform: translateX(-0.4px) rotate(-2deg); }
      20%  { transform: translateX(0.4px) rotate(2deg); }
      30%  { transform: translateX(-0.3px) rotate(-1.5deg); }
      40%  { transform: translateX(0.3px) rotate(1deg); }
      55%  { transform: translateX(-0.1px) rotate(-0.5deg); }
      70%  { transform: translateX(0.1px) rotate(0deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }

    @keyframes dotFloat {
      0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
      25%      { transform: translateY(-0.5px) scale(1.2); opacity: 0.8; }
      50%      { transform: translateY(0.3px) scale(0.9); opacity: 1; }
      75%      { transform: translateY(-0.2px) scale(1.1); opacity: 0.9; }
    }
  </style>

