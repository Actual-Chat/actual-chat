    <!-- Декоративная линия -->
    <g class="detail-line">
      <path d="M15.7477 8.10266C15.5282 7.55407 14.5408 6.67633 13.9922 6.12774L14.6505 5.25C14.8699 5.35972 16.2963 6.67633 16.7351 7.55407L15.7477 8.10266Z" fill="#7B1236"/>
    </g>
  </g>
</svg>