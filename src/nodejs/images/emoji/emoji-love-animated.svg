<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Главный ритм: 1.6s (30% + 30% + 40% пауза) */
    .heart-character {
      transform-origin: 14px 14px;
      animation: heartbeat 1.6s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Внутренняя часть пульсирует чуть иначе для объема, но БЕЗ смены цвета/прозрачности */
    .heart-inner {
      transform-origin: 14px 14px;
      animation: inner-scale 1.6s infinite ease-in-out;
    }

    /* Линия детализации плавает независимо */
    .detail-line {
      transform-origin: 15px 7px;
      animation: float-detail 2.4s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      /* Первый удар (0-30%) */
      15% { transform: scale(1.15) translateY(-0.5px); }
      30% { transform: scale(1.05); }
      /* Второй удар (30-60%) */
      45% { transform: scale(1.12) translateY(-0.3px); }
      60% { transform: scale(1); }
      /* Пауза (60-100%) */
      100% { transform: scale(1); }
    }

    @keyframes inner-scale {
      0%, 60%, 100% { transform: scale(1); }
      15% { transform: scale(1.02); }
      45% { transform: scale(1.01); }
    }

    @keyframes float-detail {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0.3px, -0.4px); }
    }
  </style>

  <g class="heart-character">
    <!-- Белая подложка -->
    <path d="M7.08297 3.92642C9.60648 2.93896 12.4591 4.14585 14.4341 5.79162C16.409 4.14585 19.1519 2.82924 21.7852 3.8167C25.6253 5.24303 27.6002 9.41231 26.1739 13.2524C24.7475 17.0926 14.5438 23.6756 14.5438 23.6756C14.5438 23.6756 4.23031 17.0926 2.80397 13.3622C1.26792 9.52203 3.24284 5.24303 7.08297 3.92642Z" fill="white"/>
    
    <!-- Розовое тело -->
    <g class="heart-inner">
      <path d="M26.1731 13.2551C26.9411 10.951 26.6119 8.42752 25.2953 6.56232C24.7467 6.12345 23.9787 5.68457 23.3204 5.46514C20.6872 4.47768 17.9442 5.79429 15.9693 7.44006C13.9944 5.79429 11.2514 4.5874 8.61822 5.57486C4.77809 6.89147 2.80317 11.1705 4.2295 15.0106C4.44894 15.5592 4.88781 16.2175 5.32668 16.7661C8.83765 20.1673 14.4333 23.6783 14.4333 23.6783C14.4333 23.6783 24.7467 17.0952 26.1731 13.2551Z" fill="#E93F7F"/>
    </g>

    <!-- Темный контур -->
