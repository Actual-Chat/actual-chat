    <style>
        .hand {
            transform-origin: 8px 13px;
            animation: salute 4s infinite;
        }
        .eyebrow {
            transform-origin: 20px 10px;
            animation: raise-brow 4s infinite;
        }
        .mouth {
            transform-origin: 26px 19px;
            animation: narrow-mouth 4s infinite;
        }
        @keyframes salute {
            0%    { opacity: 1; transform: scale(1) translate(0px, 0px); }
            40%   { opacity: 1; transform: scale(1) translate(0px, 0px); }
            45%   { opacity: 0; transform: scale(0.35) translate(-7px, 3px); }
            55%   { opacity: 0; transform: scale(0.35) translate(-7px, 3px); }
            60%   { opacity: 1; transform: scale(1.1) translate(0px, 0px); }
            65%   { opacity: 1; transform: scale(1) translate(0px, 0px); }
            100%  { opacity: 1; transform: scale(1) translate(0px, 0px); }
        }
        @keyframes raise-brow {
            0%    { transform: translateY(0); }
            55%   { transform: translateY(0); }
            63%   { transform: translateY(-0.8px); }
            75%   { transform: translateY(-0.8px); }
            85%   { transform: translateY(0); }
            100%  { transform: translateY(0); }
        }
        @keyframes narrow-mouth {
            0%    { transform: scaleX(1); }
            55%   { transform: scaleX(1); }
            63%   { transform: scaleX(0.55); }
            75%   { transform: scaleX(0.55); }
            85%   { transform: scaleX(1); }
            100%  { transform: scaleX(1); }
        }
    </style>

