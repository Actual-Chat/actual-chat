<svg width="512" height="512" viewBox="0 0 28 28" fill="none" overflow="visible" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Плавный прыжок всей какашки */
    .poop-root {
      transform-origin: 14px 26px;
      animation: mainBounce 2.5s infinite cubic-bezier(0.45, 0, 0.55, 1);
    }

    /* Анимация дымка (запаха) */
    .stink-line {
      opacity: 0;
      animation: stinkFloat 2.5s infinite ease-out;
      stroke: #351914;
    }
    
    .stink-1 { animation-delay: 1.4s; }
    .stink-2 { animation-delay: 1.2s; }
    .stink-3 { animation-delay: 1.4s; }

    @keyframes mainBounce {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      20% { transform: scale(1.1, 0.85) translateY(0); }
      50% { transform: scale(0.95, 1.1) translateY(-2px); }
      80% { transform: scale(1.05, 0.95) translateY(0); }
    }

    @keyframes stinkFloat {
      0%, 45% { opacity: 0; transform: translateY(0) scale(0.7); }
      65% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-7px) scale(1.1); }
    }
  </style>

  <!-- Группа дымка (расположение согласно запросу) -->
  <g>
    <path class="stink-line stink-1" d="M9 7Q8 5.5 9 4" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <path class="stink-line stink-2" d="M14 5Q13 3.5 14 2" stroke-width="0.7" stroke-linecap="round" fill="none"/>
    <path class="stink-line stink-3" d="M19 7Q18 5.5 19 4" stroke-width="0.7" stroke-linecap="round" fill="none"/>
  </g>

