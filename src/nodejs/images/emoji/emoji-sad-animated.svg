<svg width="512" height="512" viewBox="-2 -2 32 30" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .character-body {
            transform-origin: 14px 14px;
            animation: bodyFloat 4s infinite ease-in-out;
        }
        .eyes-group {
            transform-origin: 14px 14px;
            animation: blink 6s infinite ease-in-out;
        }
        .mouth-group {
            transform-origin: 14px 22px;
            animation: mouthPulse 4s infinite ease-in-out;
        }
        .tear-group {
            transform-origin: 5.6px 20.5px;
            animation: tearDrip 3s infinite ease-in-out;
        }
        @keyframes bodyFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-0.5px) scale(1.02, 0.98); }
        }
        @keyframes blink {
            0%, 93%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        @keyframes mouthPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08, 0.92); }
        }
        @keyframes tearDrip {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(0.8px) scale(0.95, 1.05); }
        }
    </style>

