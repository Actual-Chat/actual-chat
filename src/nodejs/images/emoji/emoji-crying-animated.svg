<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
/* Быстрая тряска головы (эффект активного плача/рыданий) */
.character-sob {
transform-origin: 14px 20px;
animation: fast-shake 0.15s infinite alternate ease-in-out;
}
code
Code
/* Моргание глаз */
.eyes-group {
  transform-origin: 14px 10px;
  animation: blink 4s infinite;
}

/* Дыхание рта */
.mouth-group {
  transform-origin: 14px 18px;
  animation: mouth-sob 0.8s infinite ease-in-out;
}

/* Бесшовная анимация водопада (смещение на один шаг паттерна) */
.waterfall-stripes {
  animation: seamless-flow 1s infinite linear;
}

@keyframes fast-shake {
  from { transform: rotate(-1.5deg) translateX(-0.1px); }
  to { transform: rotate(1.5deg) translateX(0.1px); }
}

@keyframes blink {
  0%, 90%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.1); }
}

@keyframes mouth-sob {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04, 0.96); }
}

@keyframes seamless-flow {
  from { transform: translateY(0); }
  to { transform: translateY(12px); } /* Смещение равно шагу между полосками */
}
</style>
<defs>
