<svg width="512" height="512" viewBox="-2 -2 32 32" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .character-body {
            transform-origin: 14px 20px;
            animation: breathe 3s infinite ease-in-out;
        }
        .accents {
            transform-origin: 14px 10px;
            animation: float 3s infinite ease-in-out;
        }
        .mouth-group {
            transform-origin: 13.5px 17.5px;
            animation: mouthBob 3s infinite ease-in-out;
        }
        .pupil-left {
            animation: pupilMove 3.5s infinite ease-in-out;
        }
        .pupil-right {
            animation: pupilMove 3.5s infinite ease-in-out;
        }
        .eye-left {
            animation: eyeShift 3.5s infinite ease-in-out;
        }
        .eye-right {
            animation: eyeShift 3.5s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1, 1); }
            50%      { transform: scale(1.03, 0.97); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-0.4px); }
        }
        @keyframes mouthBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(0.4px); }
        }
        @keyframes pupilMove {
            0%   { transform: translateX(0); }
            25%  { transform: translateX(-0.7px); }
            75%  { transform: translateX(0.7px); }
            100% { transform: translateX(0); }
        }
        @keyframes eyeShift {
            0%   { transform: translateX(0); }
            25%  { transform: translateX(-0.3px); }
            75%  { transform: translateX(0.3px); }
            100% { transform: translateX(0); }
        }
    </style>

