<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.character-master {
transform-origin: 14px 27px;
animation: pendulum 3s infinite ease-in-out;
}
code
Code
.eye-left {
  transform-origin: 8.55px 14.67px;
  animation: blink 4s infinite;
}

.eye-right {
  transform-origin: 19.79px 14.67px;
  animation: blink 4s infinite;
}

.face-details {
  transform-origin: 14px 14px;
  animation: eyeFollow 3s infinite ease-in-out;
}

.mouth {
  transform-origin: 14px 20px;
  animation: mouthPulse 1.5s infinite ease-in-out;
}

@keyframes pendulum {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

@keyframes eyeFollow {
  0%, 100% { transform: translateX(-0.8px); }
  50% { transform: translateX(0.8px); }
}

@keyframes blink {
  0%, 90%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.1); }
}

@keyframes mouthPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05, 0.95); }
}
</style>
