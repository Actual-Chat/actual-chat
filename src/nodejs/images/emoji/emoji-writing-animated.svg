<svg width="512" height="512" viewBox="-4 -3 38 34" overflow="visible" style="overflow: visible;" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .slide-wrapper {
            animation: slide-right 1.8s infinite ease-in-out;
        }
        .character-root {
            transform-origin: 14px 20px;
            animation: pencil-shake 0.6s infinite ease-in-out;
        }
        .mouth-group {
            transform-origin: 14px 20px;
            animation: pencil-shake-mouth 0.6s infinite ease-in-out;
        }
        @keyframes slide-right {
            0%   { transform: translateX(0px); }
            50%  { transform: translateX(3px); }
            100% { transform: translateX(0px); }
        }
        @keyframes pencil-shake {
            0%   { transform: rotate(-0.3deg) translateY(0px); }
            25%  { transform: rotate(-0.5deg) translateY(0.06px); }
            50%  { transform: rotate(-0.2deg) translateY(-0.03px); }
            75%  { transform: rotate(-0.45deg) translateY(0.05px); }
            100% { transform: rotate(-0.3deg) translateY(0px); }
        }
        @keyframes pencil-shake-mouth {
            0%   { transform: translate(0px, 0px) rotate(0deg); }
            33%  { transform: translate(-0.02px, 0.03px) rotate(0.04deg); }
            66%  { transform: translate(0.03px, -0.01px) rotate(-0.03deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
    </style>

