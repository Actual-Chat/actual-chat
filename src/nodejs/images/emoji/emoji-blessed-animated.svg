<svg width="512" height="512" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.sticker-container {
transform-origin: 14px 14px;
animation: wiggle-bounce 2.5s infinite ease-in-out;
}
code
Code
.eyes-group {
  transform-origin: 14px 15px;
  animation: blink-and-wide 4s infinite;
}

.mouth-group {
  transform-origin: 14px 20px;
  animation: laugh-shake 0.4s infinite ease-in-out;
}

.halo-group {
  transform-origin: 14px 5px;
  animation: float-drift 3s infinite ease-in-out;
}

@keyframes wiggle-bounce {
  0%, 100% { transform: rotate(0deg) scale(1); }
  15% { transform: rotate(-10deg) scale(1.08, 0.92); }
  30% { transform: rotate(8deg) scale(0.95, 1.05); }
  45% { transform: rotate(-5deg) scale(1.03, 0.97); }
  60% { transform: rotate(3deg) scale(0.98, 1.02); }
  75% { transform: rotate(0deg) scale(1); }
}

@keyframes blink-and-wide {
  0%, 40%, 60%, 100% { transform: scaleY(1) scaleX(1); }
  45%, 55% { transform: scaleY(1.2) scaleX(1.1); } /* Wide eyes */
  50% { transform: scaleY(0.1) scaleX(1.1); } /* Blink */
}

@keyframes laugh-shake {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(0.3px, -0.2px) scale(1.05); }
  75% { transform: translate(-0.3px, 0.2px) scale(0.95); }
}

@keyframes float-drift {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-1.5px) rotate(2deg); }
}
</style>
