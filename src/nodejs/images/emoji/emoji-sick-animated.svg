    <style>
        .head-group {
            transform-origin: 14px 14px;
            animation: headSquash 3s infinite ease-in-out;
        }
        .vomit-stream {
            transform-origin: 14px 19px;
            animation: streamStretch 3s infinite ease-in-out;
        }
        .puddle-group {
            transform-origin: 14px 27px;
            animation: puddleSpread 3s infinite ease-in-out;
        }
        .eyes-blink-group {
            transform-origin: 14px 11px;
            animation: blink 4s infinite;
        }
        .vomit-particle {
            animation: particleFlow 1s infinite linear;
            fill: #1C1C1C;
            opacity: 0.5;
        }
        @keyframes headSquash {
            0%, 100% { transform: scale(1, 1) translateY(0); }
            50% { transform: scale(1.06, 0.94) translateY(0.4px); }
        }
        @keyframes streamStretch {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.15); }
        }
        @keyframes puddleSpread {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.2, 0.8); }
        }
        @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        @keyframes particleFlow {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(6px); opacity: 0; }
        }
    </style>

