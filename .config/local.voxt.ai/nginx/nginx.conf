proxy_cache_path /var/cache/nginx/static-cache levels=1:2 keys_zone=static-cache:128m inactive=60m max_size=10g use_temp_path=off;

# Resolver for dynamic proxy_pass with variables
# Docker's embedded DNS (required for resolving hostnames when using variables in proxy_pass)
resolver 127.0.0.11 valid=10s ipv6=off;

# Extract worktree name from subdomain (voxt.ai only, actual.chat has no worktree support)
# Pattern: {wt}.local.voxt.ai or cdn-{wt}.local.voxt.ai or media-{wt}.local.voxt.ai
# Examples: wt1.local.voxt.ai -> wt1, cdn-wt1.local.voxt.ai -> wt1
# Note: cdn-/media- uses a DASH (not a dot) so the hostname stays a single label
# under local.voxt.ai and is covered by the committed *.local.voxt.ai wildcard cert.
map $host $worktree_name {
    default                                       "";
    # Main project hosts (no worktree)
    "~^local\.voxt\.ai$"                          "";
    "~^local\.actual\.chat$"                      "";
    "~^cdn\.local\.voxt\.ai$"                     "";
    "~^cdn\.local\.actual\.chat$"                 "";
    "~^media\.local\.voxt\.ai$"                   "";
    "~^media\.local\.actual\.chat$"               "";
    # Worktree subdomains with prefix: cdn-{wt}.local.voxt.ai / media-{wt}.local.voxt.ai
    # Match these BEFORE the bare-worktree pattern below so "cdn-wt1" doesn't get
    # treated as its own worktree name.
    "~^cdn-([^.]+)\.local\.voxt\.ai$"             $1;
    "~^media-([^.]+)\.local\.voxt\.ai$"           $1;
    # Bare worktree subdomain: {wt}.local.voxt.ai (voxt.ai only)
    "~^([^.]+)\.local\.voxt\.ai$"                 $1;
}

# Map worktree names to backend ports
# Per-worktree files in worktree-ports.d/ are auto-generated by c.ps1 (e.g., "wt1" 7090;)
map $worktree_name $backend_port {
    default 7080;
    include /etc/nginx/worktree-ports.d/*.conf;
}

# H2 cleartext sibling port = $backend_port + 1
# Used to proxy /rpc/http to Kestrel's HTTP/2-only listener.
map $backend_port $backend_h2_port {
    default 7081;
    include /etc/nginx/worktree-ports.d/*.h2.conf;
}

upstream image-proxy {
    server imageproxy:8080;
}

include snippets/ssl-params.conf;

#Redirect to SSL
server {
    listen 80;

    location / {
        return 301 https://$host$request_uri;
    }
}

# CDN server (cdn.local.voxt.ai, cdn-<wt>.local.voxt.ai, etc.)
# Must appear before the main app server so cdn-* regex matches before the catch-all.
server {
    #listen 80;
    listen 443 ssl;
    http2 on;
    server_name cdn.local.voxt.ai cdn.local.actual.chat
                ~^cdn-[^.]+\.local\.voxt\.ai$;
    ssl_protocols       TLSv1.2 TLSv1.3;
    client_max_body_size 500M;

    # Dynamic backend based on worktree
    set $backend_upstream "http://host.docker.internal:$backend_port";

    include nginx.proxy-headers.conf;

    # changed this section to support embedded test page
    location / {
        proxy_pass $backend_upstream;

        # additional setting to support Server-Side Blazor
        # https://www.indie-dev.at/2021/07/18/nginx-blazor-server-side/
        proxy_read_timeout 1d;
        proxy_connect_timeout 4;
        proxy_send_timeout 1d;

        include nginx.proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    location /media/ {
        rewrite ^/media/(.*)$ /api/content/media/$1 break;
        proxy_pass $backend_upstream;
    }
}

# Media/image proxy server (shared - stateless, no worktree routing needed)
# Must appear before the main app server so media-* regex matches before the catch-all.
server {
    #listen 80;
    listen 443 ssl;
    http2 on;
    server_name media.local.voxt.ai media.local.actual.chat
                ~^media-[^.]+\.local\.voxt\.ai$;

    include nginx.proxy-headers.conf;

    location / {
        proxy_pass http://image-proxy;
    }
}

# Main app server (local.voxt.ai, *.local.voxt.ai, local.actual.chat)
server {
    listen 443 ssl;
    http2 on;
    server_name local.voxt.ai local.actual.chat
                ~^[^.]+\.local\.voxt\.ai$;
    ssl_protocols       TLSv1.2 TLSv1.3;
    client_max_body_size 500M;

    # Dynamic backend based on worktree
    set $backend_upstream "http://host.docker.internal:$backend_port";

    location /sw.js {
        proxy_pass $backend_upstream/dist/sw.js;

        access_log off;

        add_header Cache-Control "public";
        expires 1m;
        proxy_cache static-cache;

        # ignore incorrect Kestrel settings :)
        proxy_ignore_headers Set-Cookie;
        proxy_ignore_headers Cache-Control;
        proxy_ignore_headers Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_cache_valid 200 300m;
        proxy_cache_valid 404 1m;
        proxy_cache_valid 500 1s;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 3;
        proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;

        # CORS for static files
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET' always;
        add_header 'Access-Control-Allow-Headers' 'Accept,Upgrade-Insecure-Requests,DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Encoding,Content-Length,Content-Range' always;
    }

    location = /healthz {
        access_log off;

        return 200 'health OK';
        add_header Content-Type text/plain;
    }

    location /backend/ {
        access_log off;
        return 404;
    }

    # Blazor WASM files - don't cache error responses
    location /_framework/ {
        proxy_pass $backend_upstream;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        include nginx.proxy-headers.conf;

        # Don't cache error responses
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @error_nocache;
    }

    # Static dist files - don't cache error responses
    location /dist/ {
        proxy_pass $backend_upstream;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        include nginx.proxy-headers.conf;

        # Don't cache error responses
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @error_nocache;
    }

    # Named location for error responses with no-cache headers
    location @error_nocache {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 504;
    }

    # Fusion RPC HTTP transport — forced over HTTP/2 cleartext to the
    # Kestrel HTTP/2-only sibling listener. /rpc/ws stays on the default
    # H1 listener because nginx does not translate H1 Upgrade to RFC 8441
    # Extended CONNECT.
    location ~ ^(/backend)?/rpc/http(/|$) {
        set $backend_h2_upstream "http://host.docker.internal:$backend_h2_port";
        proxy_pass $backend_h2_upstream;
        proxy_http_version 2;

        proxy_read_timeout 1d;
        proxy_connect_timeout 4;
        proxy_send_timeout 1d;

        include nginx.proxy-headers.conf;
    }

    location / {
        proxy_pass $backend_upstream;

        # additional setting to support Server-Side Blazor
        # https://www.indie-dev.at/2021/07/18/nginx-blazor-server-side/
        proxy_read_timeout 1d;
        proxy_connect_timeout 4;
        proxy_send_timeout 1d;

        include nginx.proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
