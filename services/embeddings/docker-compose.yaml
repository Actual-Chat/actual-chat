services:
  embeddings-service:
    build:
      context: .
      dockerfile: embeddings-service.dockerfile
    container_name: embeddings-service
    profiles:
      - embeddings
    ports:
      - "28080:8080"
      - "28081:8081"
    networks:
      - opensearch-net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]