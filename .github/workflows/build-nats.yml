name: Build nats docker image
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"

on:
  workflow_dispatch:
    inputs:
      deployToDev:
        description: Push image to dev GAR
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  packages: write
  issues: read
  checks: write
  statuses: write


env:
  IMAGE_TAG: "2.11.0-alpine3.21"
  TARGET_IMAGE_NAME: "nats-jet"

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image 'nats-jet:${{ env.IMAGE_TAG }}'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nats.Dockerfile
          tags: |
            ghcr.io/actual-chat/${{ env.TARGET_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          push: ${{ inputs.deployToDev }}
          build-args: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}
