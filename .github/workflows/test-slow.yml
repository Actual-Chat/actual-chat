name: Run slow tests
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  create:
  push:
    branches:
      - "**"
      - master
      - dev
      - release/v*
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
      - dev
      - release/v*

permissions:
  contents: read
  id-token: write
  packages: write
  issues: read
  checks: write
  statuses: write

jobs:
  slow-tests:
    name: Run Slow tests
    uses: ./.github/workflows/_run-tests.yml
    with:
      build-target: slow-tests
      report-name: Slow tests results
      opensearch-java-opts: '-Xms4096m -Xmx4096m'
    secrets: inherit
