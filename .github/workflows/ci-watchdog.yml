name: CI watchdog

on:
  workflow_run:
    workflows: ["Build test and deploy", "Run slow tests", "Run nightly tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: "Id of the run to classify"
        required: true
      dry-run:
        description: "Classify and report, but change nothing"
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  triage:
    name: Triage a red run
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rerun: ${{ steps.triage.outputs.rerun }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/CiWatchdog.ps1
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Triage
        id: triage
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run-id || github.event.workflow_run.id }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          . ./scripts/CiWatchdog.ps1
          $record = Invoke-CiWatchdog -RunId $env:RUN_ID -DryRun:($env:DRY_RUN -eq 'true')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Format-CiJournalNote $record)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "rerun=$($record.Rerun.ToString().ToLowerInvariant())"

  notify:
    name: Notify Voxt
    needs: triage
    # always(): a watchdog that fell over re-ran nothing, so the red still has to be reported.
    # The branch filter is Notify Voxt's own, which this workflow doesn't have.
    if: >-
      always() && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      needs.triage.outputs.rerun != 'true' &&
      (github.event.workflow_run.head_branch == 'dev' || startsWith(github.event.workflow_run.head_branch, 'release/'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-voxt.yml
    secrets: inherit

  recovery:
    name: Find the red a green run ends
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'dev' || startsWith(github.event.workflow_run.head_branch, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      note: ${{ steps.recovery.outputs.note }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/CiWatchdog.ps1
          sparse-checkout-cone-mode: false
          lfs: false

      - name: Find the red streak
        id: recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          . ./scripts/CiWatchdog.ps1
          $note = Get-CiRecoveryNote -RunId $env:RUN_ID
          Write-Host ($note ? $note : 'No reported red before this run.')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "note=$note"

  notify-recovered:
    name: Notify Voxt (green again)
    needs: recovery
    if: needs.recovery.outputs.note != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-voxt.yml
    with:
      recovery-note: ${{ needs.recovery.outputs.note }}
    secrets: inherit
