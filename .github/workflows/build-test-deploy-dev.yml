  build-android-pkg:
    name: Build android app package for ${{ github.ref_name }}
    needs:
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: D:\AC
    env:
      NUGET_PACKAGES: D:\AC\.nuget\packages
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      ActualChat_AndroidSigningKeyPass: ${{ secrets.ANDROIDSIGNINGKEYPASS }}
      ActualChat_AndroidSigningStorePass: ${{ secrets.ANDROIDSIGNINGSTOREPASS }}
      IS_DEV_MAUI: ${{ needs.calc-pkg-params.outputs.IS_DEV_MAUI }}
      APP_ID: ${{ needs.calc-pkg-params.outputs.APP_ID }}
      AAB_FILE_NAME: ${{ needs.calc-pkg-params.outputs.APP_ID }}-Signed.aab
      APK_FILE_NAME: ${{ needs.calc-pkg-params.outputs.APP_ID }}-Signed.apk
    outputs:
      AAB_ARTIFACT_NAME: ${{ needs.calc-pkg-params.outputs.APP_ID }}.${{ steps.nbgv.outputs.SemVer2 }}.aab
      APK_ARTIFACT_NAME: ${{ needs.calc-pkg-params.outputs.APP_ID }}.${{ steps.nbgv.outputs.SemVer2 }}.apk
      AAB_FILE_NAME: ${{ env.AAB_FILE_NAME }}
      APK_FILE_NAME: ${{ env.APK_FILE_NAME }}
      MAJOR_MINOR_VERSION: ${{ steps.nbgv.outputs.MajorMinorVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      - name: Prepare short workspace path
        working-directory: D:\
        run: |
          if (Test-Path 'D:\AC') { Remove-Item 'D:\AC' -Force -Recurse }
          cmd /c mklink /J D:\AC "$env:GITHUB_WORKSPACE"

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet

      - name: Install workloads
        run: dotnet workload install maui android maui-android

      - name: Replace git+ssh://git@ to https://
        run: (Get-Content package-lock.json) -replace 'git\+ssh:\/\/git@', 'https://' | Set-Content package-lock.json

      - name: Generate version variables
        id: nbgv
        uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - name: Prepare GoogleServices file for dev
        if: ${{env.IS_DEV_MAUI == 'true'}}
        run: |-
          @"
          ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          "@ | Set-Content -Path src/dotnet/App.Maui/Platforms/Android/Resources/google-services.json.dev

      - name: Prepare GoogleServices file for prod
        if: ${{env.IS_DEV_MAUI == 'false'}}
        run: |-
          @"
          ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
          "@ | Set-Content -Path src/dotnet/App.Maui/Platforms/Android/Resources/google-services.json.prod

      - name: Build app package
        run: |-
          ./run-build.cmd publish-android --configuration Release --is-dev-maui "${{env.IS_DEV_MAUI}}"

      - name: Upload package to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.calc-pkg-params.outputs.APP_ID }}.${{ steps.nbgv.outputs.SemVer2 }}.aab
          path: D:\AC\artifacts\publish\App.Maui\release_net11.0-android\${{env.AAB_FILE_NAME}}
          if-no-files-found: error
          compression-level: 0
          retention-days: 10

      - name: Upload apk to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.calc-pkg-params.outputs.APP_ID }}.${{ steps.nbgv.outputs.SemVer2 }}.apk
          path: D:\AC\artifacts\publish\App.Maui\release_net11.0-android\${{env.APK_FILE_NAME}}
          if-no-files-found: error
          compression-level: 0
          retention-days: 10

  deploy-android-dev-to-drive:
    name: Deploy android app package to google drive for ${{ github.ref_name }}
    needs:
      - build-android-pkg
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{needs.calc-pkg-params.outputs.APP_ID}}
      ARTIFACT_NAME: ${{needs.build-android-pkg.outputs.APK_ARTIFACT_NAME}}
      PACKAGE_FILE_NAME: ${{needs.build-android-pkg.outputs.APK_FILE_NAME}}
      MAJOR_MINOR_VERSION: ${{needs.build-android-pkg.outputs.MAJOR_MINOR_VERSION}}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1074465586741/locations/global/workloadIdentityPools/actual-identity-pool/providers/github-actual-chat
          service_account: sa-deploy-bot@actual-infrastructure.iam.gserviceaccount.com
          create_credentials_file: "true"

      - name: Download package file from artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: v${{env.MAJOR_MINOR_VERSION}}/

      - name: Prepare google service account json variable
        run: |-
          saJson=$(cat ${{ steps.auth.outputs.credentials_file_path }})
          echo ::add-mask::$saJson
          echo "SERVICE_ACCOUNT_JSON=$saJson" >> $GITHUB_ENV

      - name: Upload app package to google drive
        uses: logickoder/g-drive-upload@main
        with:
          filename: v${{env.MAJOR_MINOR_VERSION}}/${{env.PACKAGE_FILE_NAME}}
          name: ${{env.ARTIFACT_NAME}}
          folderId: ${{secrets.GDRIVE_BUILDS_FOLDER_ID}}
          credentials: ${{env.SERVICE_ACCOUNT_JSON}}
          mirrorDirectoryStructure: true
          overwrite: true

  deploy-android-to-play-store:
    name: Deploy android app package to google play store for ${{ github.ref_name }}
    needs:
      - build-android-pkg
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.calc-pkg-params.outputs.ENVIRONMENT }}
    env:
      ARTIFACT_NAME: ${{needs.build-android-pkg.outputs.AAB_ARTIFACT_NAME}}
      PACKAGE_FILE_NAME: ${{needs.build-android-pkg.outputs.AAB_FILE_NAME}}
      IS_DEV_MAUI: ${{ needs.calc-pkg-params.outputs.IS_DEV_MAUI }}
      APP_ID: ${{ needs.calc-pkg-params.outputs.APP_ID }}
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1074465586741/locations/global/workloadIdentityPools/actual-identity-pool/providers/github-actual-chat
          service_account: sa-deploy-bot@actual-infrastructure.iam.gserviceaccount.com
          create_credentials_file: "true"

      - name: Download package file from artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}

      - run: test -f ${{env.PACKAGE_FILE_NAME}} || exit 1

      # The AAB carries the R8/ProGuard mapping automatically (Play reads it from
      # BUNDLE-METADATA), but not native symbols. Extract the arm64 .so files
      # (AndroidStripNativeLibraries=false keeps their symbol tables) into a lib/
      # tree so Android Vitals can symbolicate native crash stacks.
      - name: Extract native debug symbols from AAB
        run: |
          unzip -o "${{env.PACKAGE_FILE_NAME}}" 'base/lib/*' -d native-debug-symbols
          find native-debug-symbols/base/lib -name '*.so' -printf '%s\t%p\n'

      # The runtime-pack libs (libmonosgen, libcoreclr, libSystem.*, …) ship
      # stripped; their *.so.dbg symbol files live on the Microsoft symbol server,
      # keyed by ELF build-id. Pull them and swap each symbol-bearing file in place
      # of the stripped .so so Play matches them. || true: msdl only serves official
      # runtime versions — a miss must not fail the deploy.
      - name: Fetch runtime-pack native symbols from Microsoft symbol server
        run: |
          dotnet tool install -g dotnet-symbol
          export PATH="$PATH:$HOME/.dotnet/tools"
          libdir=native-debug-symbols/base/lib/arm64-v8a
          dotnet-symbol --symbols --output "$libdir" "$libdir"/*.so || true
          for dbg in "$libdir"/*.so.dbg; do
            [ -e "$dbg" ] && mv -f "$dbg" "${dbg%.dbg}"
          done
          ls -la "$libdir"

      - name: Deploy to internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: ${{env.APP_ID}}
          releaseFiles: ${{env.PACKAGE_FILE_NAME}}
          track: internal
          debugSymbols: native-debug-symbols/base/lib

  build-win-pkg:
    name: Build win app package for ${{ github.ref_name }}
    needs:
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
