name: Build test and deploy
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      buildAppFor:
        type: choice
        required: false
        default: ""
        description: Build app package for environment
        options:
          - ""
          - auto
          - dev
          - prod
      skipTests:
        type: boolean
        required: false
        default: false
        description: Skip unit and integration tests
      useNativeAot:
        type: boolean
        required: false
        default: false
        description: Build the iOS app with Native AOT (experimental, hits upstream linker bug — dotnet/runtime#119380)
  create:
  push:
    branches:
      - "**"
      - master
      - dev
      - release/v*
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
      - dev
      - release/v*

permissions:
  contents: read
  id-token: write
  packages: write
  issues: read
  checks: write
  statuses: write

jobs:
  check-tested:
    name: Check for tested flag
    runs-on: ubuntu-latest
    outputs:
      skip-tests: ${{ steps.check.outputs.skip-tests }}
    steps:
      - name: Check commit message for #tested
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SKIP_TESTS_INPUT: ${{ github.event.inputs.skipTests }}
        run: |
          if [[ "$SKIP_TESTS_INPUT" == "true" ]] || echo "$COMMIT_MESSAGE" | grep -qiw '#tested'; then
            echo "skip-tests=true" | tee -a $GITHUB_OUTPUT
          else
            echo "skip-tests=false" | tee -a $GITHUB_OUTPUT
          fi

  calc-pkg-params:
    name: Calculate package related variables
    needs:
      - unit-tests
      - integration-tests
    runs-on: ubuntu-latest
    outputs:
      IS_DEV_MAUI: ${{ steps.calc.outputs.IS_DEV_MAUI }}
      APP_ID: ${{ steps.calc.outputs.APP_ID }}
      MUST_BUILD_PACKAGE: ${{ steps.calc.outputs.MUST_BUILD_PACKAGE }}
      ENVIRONMENT: ${{ steps.calc.outputs.ENVIRONMENT }}
      IS_PROD_BRANCH: ${{ steps.calc.outputs.IS_PROD_BRANCH }}
    steps:
      - id: calc
        name: Calculate params for package jobs
        run: |
          buildFor="${{ github.event.inputs.buildAppFor }}"
          isDevBranch="${{ github.ref == 'refs/heads/dev' }}"
          isProdBranch="${{ startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master' }}"
          if [[ $buildFor == prod && $isProdBranch != true ]]; then
            >&2 echo Production build is allowed only from master and release branches
            exit /b 1
          fi

          isDevMaui=true
          appId=chat.actual.dev.app
          if [[ $isProdBranch == true && $buildFor != dev ]]; then
            isDevMaui=false
            appId=chat.actual.app
          fi

          mustBuildPkg=false
          if [[ $buildFor != "" || $isDevBranch == true || $isProdBranch == true ]]; then
            mustBuildPkg=true
          fi

          environment=prod
          if [[ $buildFor == dev || $isProdBranch == false ]]; then
            environment=""
          fi

          echo "IS_DEV_MAUI=$isDevMaui" | tee -a $GITHUB_OUTPUT
          echo "APP_ID=$appId" | tee -a $GITHUB_OUTPUT
          echo "MUST_BUILD_PACKAGE=$mustBuildPkg" | tee -a $GITHUB_OUTPUT
          echo "ENVIRONMENT=$environment" | tee -a $GITHUB_OUTPUT
          echo "IS_PROD_BRANCH=$isProdBranch" | tee -a $GITHUB_OUTPUT

  build:
    name: Build image for ${{ github.ref_name }}
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/pull/') ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      semver2: ${{ steps.nbgv.outputs.SemVer2 }}
      version: ${{ steps.nbgv.outputs.Version }}
      simple-version: ${{ steps.nbgv.outputs.SimpleVersion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      - name: Checkout configs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONFIGS_REPO_GITHUB_TOKEN }}
          fetch-depth: 1
          repository: Actual-Chat/configs
          path: configs/
          sparse-checkout: |
            prompts/
          sparse-checkout-cone-mode: false
          ref: ${{ startsWith(github.ref_name, 'release/') && github.ref_name || 'master' }}

      - name: Verify checked-out configs commit
        run: |
          cd configs/  # Navigate to the checked-out repo
          git pull  # Update the repo
          git log --oneline -1  # Show the latest commit
          cd ../

      - name: Copy prompts
        run: |
          mv configs/prompts .config/
          rm -rf configs/

      - name: Free Disk Space (Ubuntu)
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: true
          tools-cache: true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Replace git+ssh://git@ to https://
        run: sed -i 's/git+ssh:\/\/git@/https:\/\//g' package-lock.json

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet
        with:
          restore: false
          restore-workloads: false

      - name: Generate version variables
        id: nbgv
        uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - name: Generate Nerdbank.GitVersioning files
        run: ./run-build.cmd generate-version

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1074465586741/locations/global/workloadIdentityPools/actual-identity-pool/providers/github-actual-chat
          service_account: sa-deploy-bot@actual-infrastructure.iam.gserviceaccount.com

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image 'actual-chat-app:${{ steps.nbgv.outputs.SemVer2 }}'
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: "NPM_READ_TOKEN=${{secrets.NPM_READ_TOKEN}}"
          tags: |
            ghcr.io/actual-chat/actual-chat-app:${{ steps.nbgv.outputs.SemVer2 }}
          push: ${{github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')}}

      - name: Build image 'actual-chat-migration:${{ steps.nbgv.outputs.SemVer2 }}'
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: "NPM_READ_TOKEN=${{secrets.NPM_READ_TOKEN}}"
          target: migrations-app
          tags: |
            ghcr.io/actual-chat/actual-chat-migration:${{ steps.nbgv.outputs.SemVer2 }}
          push: ${{github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')}}

      - name: Build image 'actual-chat-opensearch-configurator:${{ steps.nbgv.outputs.SemVer2 }}'
        uses: docker/build-push-action@v5
        with:
          context: ./services/opensearch/
          tags: |
            ghcr.io/actual-chat/actual-chat-opensearch-configurator:${{ steps.nbgv.outputs.SemVer2 }}
          push: ${{github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')}}

  unit-tests:
    name: Run Unit tests
    needs: [check-tested]
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      SKIP_TESTS: ${{ needs.check-tested.outputs.skip-tests }}
    steps:
      - name: Skip tests
        if: env.SKIP_TESTS == 'true'
        run: 'echo "Tests are skipped"'

      - name: Free Disk Space (Ubuntu)
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          android: false
          dotnet: true
          haskell: false
          large-packages: false
          swap-storage: true
          docker-images: true
          tools-cache: true

      - name: Install dependencies
        if: env.SKIP_TESTS != 'true'
        run: |
          sudo sed -ri 's|http://(azure\.)?archive\.ubuntu\.com|https://\1archive.ubuntu.com|g; s|http://security\.ubuntu\.com|https://security.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y libatomic1
      - name: Checkout
        if: env.SKIP_TESTS != 'true'
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      - name: Setup dotnet
        if: env.SKIP_TESTS != 'true'
        uses: ./.github/actions/setup-dotnet
        with:
          restore-tools: false
          restore-workloads: false

      - name: Debug build of tests
        if: env.SKIP_TESTS != 'true'
        run: |
          dotnet build ActualChat.CI.slnf --nologo --no-restore --configuration Debug

      - name: Run unit tests
        if: env.SKIP_TESTS != 'true'
        id: run-unit-tests
        run: ./run-build.cmd unit-tests --configuration Debug
#        run: ./run-build.cmd unit-tests --configuration Debug --dumps

      - name: Upload crash dumps (unit)
        if: failure() && steps.run-unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-unit
          path: |
            artifacts/tests/crash-dumps/**/*
            **/TestResults/**/*.dmp
            **/TestResults/**/*_crashdump*
            **/TestResults/**/Sequence*.xml
            **/TestResults/**/*sequence*.xml
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: 'true'
          compression-level: '9'

      - name: Report unit test results
        uses: phoenix-actions/test-reporting@v15
        if: (success() || failure()) && env.SKIP_TESTS != 'true'
        with:
          name: Unit tests results
          path: "./tests/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: false
          output-to: "step-summary"
          only-summary: "true"

  integration-tests:
    name: Run Integration tests
    needs: [check-tested]
    strategy:
      fail-fast: false
      matrix:
        shard: [users, chat, mlsearch, core]
    uses: ./.github/workflows/_run-tests.yml
    with:
      build-target: integration-tests-${{ matrix.shard }}
      report-name: Integration tests (${{ matrix.shard }})
      checkout-configs: true
      skip-tests: ${{ needs.check-tested.outputs.skip-tests == 'true' }}
    secrets: inherit

  ts-unit-tests:
    name: TS Unit Tests
    needs: [check-tested]
    runs-on: ubuntu-latest
    env:
      SKIP_TESTS: ${{ needs.check-tested.outputs.skip-tests }}
    steps:
      - name: Skip tests
        if: env.SKIP_TESTS == 'true'
        run: 'echo "Tests are skipped"'

      - name: Checkout
        if: env.SKIP_TESTS != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js
        if: env.SKIP_TESTS != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replace git+ssh://git@ to https://
        if: env.SKIP_TESTS != 'true'
        run: sed -i 's/git+ssh:\/\/git@/https:\/\//g' package-lock.json

      - name: Install dependencies
        if: env.SKIP_TESTS != 'true'
        run: npm ci
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Run TS unit tests
        if: env.SKIP_TESTS != 'true'
        run: npm run test:unit

      - name: Report TS unit test results
        uses: phoenix-actions/test-reporting@v15
        if: (success() || failure()) && env.SKIP_TESTS != 'true'
        with:
          name: TS Unit tests results
          path: tmp/ts-unit-tests.xml
          reporter: java-junit
          fail-on-error: false
          output-to: "step-summary"
          only-summary: "true"

  nuget-pack:
    name: Create nuget packages for ${{ github.ref_name }}
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/dev' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet

      - name: Prepare snk file
        run: echo -n "${{secrets.SNK_BASE64}}" | base64 -d | tee ActualChat.snk >/dev/null

      - name: Generate Nerdbank.GitVersioning files
        run: ./run-build.cmd generate-version

      - name: Create nuget packages
        # workaround: generating slnf without App.* projects to avoid extra workloads installation
        run: ./run-build.cmd slnf && dotnet pack -c Release -p:PUBLIC_BUILD=true ActualChat.CI.slnf

      - uses: actions/upload-artifact@v4
        with:
          name: nuget_packages
          path: artifacts/nupkg/*.nupkg

  nuget-push:
    name: Push nuget packages for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs:
      - nuget-pack
      - unit-tests
      - integration-tests
    environment: ${{ (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) && 'prod' || '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget_packages

      - name: push packages
        run: dotnet nuget push *.nupkg -k "${{ secrets.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json

  deploy-dev:
    name: Deploy dev
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/dev'    ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs:
      - build
      - unit-tests
      - integration-tests
    environment: dev
    steps:
      - name: Checking out ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1074465586741/locations/global/workloadIdentityPools/actual-identity-pool/providers/github-actual-chat
          service_account: sa-deploy-bot@actual-infrastructure.iam.gserviceaccount.com

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Deploy dev
        if: |
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release/')
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-app:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker-dev/actual-chat-app:${{needs.build.outputs.semver2}}

      - name: Deploy dev migrations
        if: |
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release/')
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-migration:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker-dev/actual-chat-migration:${{needs.build.outputs.semver2}}

      - name: Deploy dev opensearch configurator
        if: |
          github.ref == 'refs/heads/dev' ||
          startsWith(github.ref, 'refs/heads/release/')
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-opensearch-configurator:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker-dev/actual-chat-opensearch-configurator:${{needs.build.outputs.semver2}}

  deploy-prod:
    name: Deploy prod
    if: |
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy-dev
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/1074465586741/locations/global/workloadIdentityPools/actual-identity-pool/providers/github-actual-chat
          service_account: sa-deploy-bot@actual-infrastructure.iam.gserviceaccount.com

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Deploy prod
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-app:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker/actual-chat-app:${{needs.build.outputs.simple-version}}

      - name: Deploy prod migrations
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-migration:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker/actual-chat-migration:${{needs.build.outputs.semver2}}

      - name: Deploy prod opensearch configurator
        uses: akhilerm/tag-push-action@v2.2.0
        with:
          src: ghcr.io/actual-chat/actual-chat-opensearch-configurator:${{needs.build.outputs.semver2}}
          dst: |
            us-central1-docker.pkg.dev/actual-infrastructure/docker/actual-chat-opensearch-configurator:${{needs.build.outputs.semver2}}

  build-ios-pkg:
    name: Build ios app package for ${{ github.ref_name }}
    needs:
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: macos-26
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      IS_DEV_MAUI: ${{ needs.calc-pkg-params.outputs.IS_DEV_MAUI }}
      APP_ID: ${{ needs.calc-pkg-params.outputs.APP_ID }}
      ENTITLEMENTS_FILE: Entitlements.${{ needs.calc-pkg-params.outputs.IS_DEV_MAUI == 'true' && 'dev' || 'prod' }}.plist
      PACKAGE_FILE_NAME: App-signed.ipa
    outputs:
      ARTIFACT_NAME: ${{env.APP_ID}}.${{steps.nbgv.outputs.SemVer2}}.ipa
      PACKAGE_FILE_NAME: ${{env.PACKAGE_FILE_NAME}}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      - name: Install Provisioning Profile for DEV
        uses: ./.github/actions/install-provisioning-profile
        if: ${{env.IS_DEV_MAUI == 'true'}}
        with:
          base64: ${{ secrets.PROVISIONING_PROFILE_DEV_BASE64 }}

      - name: Install Provisioning Profile for PROD
        uses: ./.github/actions/install-provisioning-profile
        if: ${{env.IS_DEV_MAUI == 'false'}}
        with:
          base64: ${{ secrets.PROVISIONING_PROFILE_PROD_BASE64 }}

      - name: Install Provisioning Profile (Share extension) for DEV
        uses: ./.github/actions/install-provisioning-profile
        if: ${{env.IS_DEV_MAUI == 'true'}}
        with:
          base64: ${{ secrets.PROVISIONING_PROFILE_SHARE_DEV_BASE64 }}

      - name: Install Provisioning Profile (Share extension) for PROD
        uses: ./.github/actions/install-provisioning-profile
        if: ${{env.IS_DEV_MAUI == 'false'}}
        with:
          base64: ${{ secrets.PROVISIONING_PROFILE_SHARE_PROD_BASE64 }}

      - name: Install the Apple distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{secrets.APPLE_DISTRIBUTION_CERT_BASE64}}
          P12_PASSWORD: ${{secrets.APPLE_DISTRIBUTION_CERT_PASSWORD}}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo ::Importing certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          echo ::Creating temporary key chain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo ::Importing certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          echo :: set-key-partition-list
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo :: list-keychains
          security list-keychains -d user -s $KEYCHAIN_PATH
          security find-identity -p codesigning -v

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet

      - name: Install workloads (pinned to the .NET 11 preview 6 workload band — see #3839)
        run: dotnet workload install maui ios maui-ios --from-rollback-file ${{github.workspace}}/.github/workloads-net11-p6.json

      - name: Replace git+ssh://git@ to https://
        run: sed -i -E 's/git+ssh:\/\/git@/https:\/\//g' package-lock.json

      - name: Generate version variables
        id: nbgv
        uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - name: Restore nuget packages
        run: |-
          ./run-build.cmd restore

      - name: Prepare GoogleServices file for DEV
        if: ${{env.IS_DEV_MAUI == 'true'}}
        run: |-
          tee src/dotnet/App.Maui/Platforms/iOS/GoogleService-Info.plist.dev src/dotnet/App.Maui/GoogleService-Info.plist <<EOF
          ${{ secrets.GOOGLE_SERVICES_PLIST_DEV }}
          EOF

      - name: Prepare GoogleServices file for PROD
        if: ${{ env.IS_DEV_MAUI == 'false' }}
        run: |-
          tee src/dotnet/App.Maui/Platforms/iOS/GoogleService-Info.plist.prod src/dotnet/App.Maui/GoogleService-Info.plist <<EOF
          ${{ secrets.GOOGLE_SERVICES_PLIST_PROD }}
          EOF

      - name: PList - set aps-environment
        uses: dppeak/update-ios-plist-action@v1.1.0
        with:
          info-plist-path: "src/dotnet/App.Maui/Platforms/iOS/${{env.ENTITLEMENTS_FILE}}"
          key-value-json: '[{"aps-environment": "production"}]'
          print-file: true

      - name: PList - set URL scheme to voxt for prod
        if: ${{ env.IS_DEV_MAUI == 'false' }}
        uses: dppeak/update-ios-plist-action@v1.1.0
        with:
          info-plist-path: "src/dotnet/App.Maui/Platforms/iOS/Info.plist"
          key-value-json: '[{"CFBundleURLTypes": [{"CFBundleTypeRole": "Editor", "CFBundleURLName": "ai.voxt", "CFBundleURLSchemes": ["voxt"]}]}]'
          print-file: true

      - name: Build app package
        run: |-
          ./run-build.cmd publish-ios --configuration Release --is-dev-maui "${{env.IS_DEV_MAUI}}" --use-native-aot "${{ github.event.inputs.useNativeAot || 'false' }}"
          pushd artifacts/publish/App.Maui/release_net11.0-ios_ios-arm64
          unzip ActualChat.ipa
          rm -r Payload/ActualChat.app/_CodeSignature
          rm -r Payload/ActualChat.app/PlugIns/*/_CodeSignature
          rm -r Payload/ActualChat.app/Frameworks/*/_CodeSignature
          codesign -f -s "Apple Distribution: Actual Chat Inc. (M287G8G83F)" Payload/ActualChat.app/Frameworks/*
          codesign -f -s "Apple Distribution: Actual Chat Inc. (M287G8G83F)" Payload/ActualChat.app/PlugIns/* --entitlements ${{github.workspace}}/src/dotnet/App.Maui.IosShareExt/${{env.ENTITLEMENTS_FILE}}
          codesign -f -s "Apple Distribution: Actual Chat Inc. (M287G8G83F)" --entitlements ${{github.workspace}}/src/dotnet/App.Maui/Platforms/iOS/${{env.ENTITLEMENTS_FILE}} Payload/ActualChat.app
          zip -r "${{env.PACKAGE_FILE_NAME}}" Payload
          popd

      - name: Upload package to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.APP_ID}}.${{steps.nbgv.outputs.SemVer2}}.ipa
          path: artifacts/publish/App.Maui/release_net11.0-ios_ios-arm64/${{env.PACKAGE_FILE_NAME}}
          if-no-files-found: error
          compression-level: 0
          retention-days: 10

      - name: Upload dSYMs to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.APP_ID}}.${{steps.nbgv.outputs.SemVer2}}.dSYMs
          path: artifacts/bin/App.Maui/release_net11.0-ios_ios-arm64/*.dSYM
          if-no-files-found: error
          retention-days: 90

  deploy-ios-to-appstore:
    name: Deploy ios app package to apple app store for ${{ github.ref_name }}
    # release branch can build for both dev and prod envs while other branches can build only for dev env
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: macos-26
    needs:
      - build-ios-pkg
      - calc-pkg-params
    environment: ${{ needs.calc-pkg-params.outputs.ENVIRONMENT }}
    env:
      APP_ID: ${{needs.calc-pkg-params.outputs.APP_ID}}
      ARTIFACT_NAME: ${{needs.build-ios-pkg.outputs.ARTIFACT_NAME}}
      PACKAGE_FILE_NAME: ${{needs.build-ios-pkg.outputs.PACKAGE_FILE_NAME}}
      API_KEY_BASE64: ${{secrets.APPSTORE_API_KEY_BASE64}}
      API_KEY_ID: ${{secrets.APPSTORE_API_KEY_ID}}
      API_ISSUER_ID: ${{secrets.APPSTORE_API_ISSUER_ID}}
    steps:
      - name: Download package file from artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}

      - name: Install App Store api key
        run: |-
          mkdir -p ~/.appstoreconnect/private_keys/
          echo -n "${{ env.API_KEY_BASE64 }}" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${{ env.API_KEY_ID }}.p8
          ls -ls ~/.appstoreconnect/private_keys/

      - name: Validate App
        run: |-
          xcrun altool --validate-app -f ${{env.PACKAGE_FILE_NAME}} -t ios --apiKey ${{env.API_KEY_ID}} --apiIssuer ${{env.API_ISSUER_ID}} --show-progress --verbose --output-format json
        shell: bash

      - name: Upload App
        run: |
          xcrun altool --upload-app -f ${{env.PACKAGE_FILE_NAME}} -t ios --apiKey ${{env.API_KEY_ID}} --apiIssuer ${{env.API_ISSUER_ID}} --show-progress --verbose --output-format json
        shell: bash

  build-maccatalyst-pkg:
    name: Build maccatalyst app package for ${{ github.ref_name }}
    needs:
      - calc-pkg-params
    if: ${{ needs.calc-pkg-params.outputs.MUST_BUILD_PACKAGE == 'true' }}
    runs-on: macos-26
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      IS_DEV_MAUI: ${{ needs.calc-pkg-params.outputs.IS_DEV_MAUI }}
      APP_ID: ${{ needs.calc-pkg-params.outputs.APP_ID }}
    outputs:
      ARTIFACT_NAME: ${{env.APP_ID}}.${{steps.nbgv.outputs.SemVer2}}.pkg
      PACKAGE_FILE_NAME: ${{steps.pkg.outputs.PACKAGE_FILE_NAME}}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0
          lfs: true

      # Mac Catalyst distribution profiles are .provisionprofile files; install them
      # directly (the shared install-provisioning-profile action saves .mobileprovision,
      # which the Mac Catalyst signing pipeline doesn't pick up).
      - name: Install Mac Catalyst Provisioning Profile for DEV
        if: ${{env.IS_DEV_MAUI == 'true'}}
        shell: bash
        run: |-
          PP=$RUNNER_TEMP/maccat.provisionprofile
          echo -n "${{ secrets.PROVISIONING_PROFILE_MAC_DEV_BASE64 }}" | base64 --decode -o $PP
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(security cms -D -i $PP | plutil -extract UUID raw -o - -)
          mv $PP ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.provisionprofile
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Install Mac Catalyst Provisioning Profile for PROD
        if: ${{env.IS_DEV_MAUI == 'false'}}
        shell: bash
        run: |-
          PP=$RUNNER_TEMP/maccat.provisionprofile
          echo -n "${{ secrets.PROVISIONING_PROFILE_MAC_PROD_BASE64 }}" | base64 --decode -o $PP
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(security cms -D -i $PP | plutil -extract UUID raw -o - -)
          mv $PP ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.provisionprofile
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Install Apple distribution + installer certificates
        env:
          DIST_CERT_BASE64: ${{secrets.APPLE_DISTRIBUTION_CERT_BASE64}}
          DIST_CERT_PASSWORD: ${{secrets.APPLE_DISTRIBUTION_CERT_PASSWORD}}
          INSTALLER_CERT_BASE64: ${{secrets.MAC_INSTALLER_CERT_BASE64}}
          INSTALLER_CERT_PASSWORD: ${{secrets.MAC_INSTALLER_CERT_PASSWORD}}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo ::Importing Apple Distribution certificate
          DIST=$RUNNER_TEMP/dist.p12
          echo -n "$DIST_CERT_BASE64" | base64 --decode -o $DIST
          security import $DIST -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          echo ::Importing 3rd Party Mac Developer Installer certificate
          INST=$RUNNER_TEMP/installer.p12
          echo -n "$INSTALLER_CERT_BASE64" | base64 --decode -o $INST
          security import $INST -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH
          security find-identity -p basic -v

      - name: Setup dotnet
        uses: ./.github/actions/setup-dotnet

      - name: Install workloads (pinned to the .NET 11 preview 6 workload band — see #3839)
        run: dotnet workload install maui maccatalyst maui-maccatalyst --from-rollback-file ${{github.workspace}}/.github/workloads-net11-p6.json

      - name: Replace git+ssh://git@ to https://
        run: sed -i -E 's/git+ssh:\/\/git@/https:\/\//g' package-lock.json

      - name: Generate version variables
        id: nbgv
        uses: dotnet/nbgv@master
        with:
          setAllVars: true

      - name: Restore nuget packages
        run: |-
          ./run-build.cmd restore

      - name: Prepare GoogleServices file for DEV
        if: ${{env.IS_DEV_MAUI == 'true'}}
        run: |-
          tee src/dotnet/App.Maui/Platforms/iOS/GoogleService-Info.plist.dev src/dotnet/App.Maui/GoogleService-Info.plist <<EOF
          ${{ secrets.GOOGLE_SERVICES_PLIST_DEV }}
          EOF

      - name: Prepare GoogleServices file for PROD
        if: ${{ env.IS_DEV_MAUI == 'false' }}
        run: |-
          tee src/dotnet/App.Maui/Platforms/iOS/GoogleService-Info.plist.prod src/dotnet/App.Maui/GoogleService-Info.plist <<EOF
          ${{ secrets.GOOGLE_SERVICES_PLIST_PROD }}
          EOF

      - name: PList - set MacCatalyst URL scheme to voxt for prod
        if: ${{ env.IS_DEV_MAUI == 'false' }}
        uses: dppeak/update-ios-plist-action@v1.1.0
        with:
          info-plist-path: "src/dotnet/App.Maui/Platforms/MacCatalyst/Info.plist"
          key-value-json: '[{"CFBundleURLTypes": [{"CFBundleTypeRole": "Editor", "CFBundleURLName": "ai.voxt", "CFBundleURLSchemes": ["voxt"]}]}]'
          print-file: true

      # publish-maccatalyst (Release) builds, signs with the Apple Distribution cert,
      # and — via CreatePackage + EnablePackageSigning — emits the installer-signed
      # .pkg directly.
      - name: Build app package
        id: pkg
        run: |-
          ./run-build.cmd publish-maccatalyst --configuration Release --is-dev-maui "${{env.IS_DEV_MAUI}}"
          PKG=$(ls artifacts/publish/App.Maui/release_net11.0-maccatalyst_maccatalyst-arm64/*.pkg | head -1)
          echo "PACKAGE_FILE_NAME=$(basename "$PKG")" | tee -a $GITHUB_OUTPUT

      - name: Upload package to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.APP_ID}}.${{steps.nbgv.outputs.SemVer2}}.pkg
          path: artifacts/publish/App.Maui/release_net11.0-maccatalyst_maccatalyst-arm64/*.pkg
          if-no-files-found: error
          compression-level: 0
          retention-days: 10

  deploy-maccatalyst-to-appstore:
