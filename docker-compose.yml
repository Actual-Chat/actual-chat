name: actual-chat-infra
include:
  - ./services/aspire/docker-compose.yaml
  - ./services/embeddings/docker-compose.yaml
  - ./services/opensearch/docker-compose.yaml

# Shared base for the chrome-devtools-mcp-* services. Each instance reads its
# target Chrome debug port from $CHROME_DEBUG_PORT, so callers control the
# binding via the environment override on the service (or the .env file) — not
# baked into the compose definition. Listens on port 8765 internally; the
# instance maps it to a unique host port.
x-chrome-devtools-mcp-base: &chrome-devtools-mcp-base
  image: node:20-alpine
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command:
    - sh
    - -c
    - |
      # Chrome's /json/version rejects Host headers that aren't localhost or
      # an IP literal, so resolve host.docker.internal to IPv4 here.
      HOST_IP=$$(getent ahosts host.docker.internal | awk '$$1 ~ /\./ { print $$1; exit }')
      echo "Resolved host.docker.internal -> $$HOST_IP, target Chrome :$$CHROME_DEBUG_PORT"
      exec npx -y supergateway \
        --stdio "npx -y chrome-devtools-mcp@0.20.0 --browserUrl http://$$HOST_IP:$$CHROME_DEBUG_PORT --acceptInsecureCerts" \
        --outputTransport streamableHttp \
        --stateful \
        --port 8765 \
        --healthEndpoint /healthz \
        --logLevel info
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8765/healthz >/dev/null 2>&1 || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

services:
  redis:
    image: "valkey/valkey:9.0.3-alpine3.23"
    ports:
     - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "--raw", "incr", "ping" ]
  postgres:
    image: "postgres:14.0-alpine3.14"
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_HOST_AUTH_METHOD: "password"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: ["docker-entrypoint.sh", "-c", "shared_buffers=256MB", "-c", "max_connections=1000", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "log_statement=all", "-c", "log_statement_sample_rate=0.1"]
  imageproxy:
    image: willnorris/imageproxy:latest
    platform: linux/amd64
    expose:
      - 8080
    environment:
      - IMAGEPROXY_CACHE=memory:100:24h
      - SSL_CERT_DIR=/usr/local/share/ca-certificates/
    volumes:
      - ./.config/local.voxt.ai/ssl/local.voxt.ai.crt:/usr/local/share/ca-certificates/local.voxt.ai.crt
    extra_hosts:
      - "cdn.local.voxt.ai:host-gateway"
      - "cdn.local.actual.chat:host-gateway"
  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.config/local.voxt.ai/ssl:/etc/ssl
      - ./.config/local.voxt.ai/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./.config/local.voxt.ai/nginx/nginx.proxy-headers.conf:/etc/nginx/nginx.proxy-headers.conf
      - ./.config/local.voxt.ai/nginx/snippets:/etc/nginx/snippets
      - ./.config/local.voxt.ai/nginx/dhparam.pem:/etc/nginx/dhparam.pem
      # Per-worktree port mappings (auto-generated by c.ps1, e.g., wt1.conf -> "wt1" 7090;)
      - ./artifacts/worktree-ports.d:/etc/nginx/worktree-ports.d:ro
    # To have logging, uncomment line below and adjust path to log file and ensure it exists
    #  - ./.config/local.voxt.ai/log/nginx/access.log:/var/log/nginx/access.log
    extra_hosts:
      - "local.voxt.ai:host-gateway"
      - "local.actual.chat:host-gateway"
      - "embedded.voxt.ai:host-gateway"
  dns-forwarder:
    # Note: DNS_FORWARDER variable
    # In some cases this dns service is not required (macos).
    # To solve this issue while having the same config for all devs
    # this service has profile set with DNS_FORWARDER env variable.
    # So, for those who does NOT want to have this service running
    # you can set DNS_FORWARDER variable in the .env file.
    # Example: cat ./.env
    #   DNS_FORWARDER="no-dns"
    # For other developers this will not change anything
    # as an empty profile will be dismissed and the service
    # will start normally.
    profiles:
      - ${DNS_FORWARDER}
    image: 4km3/dnsmasq
    cap_add:
      - NET_ADMIN
    ports:
      - "${LOCAL_IP:?Set LOCAL_IP in .env or run docker-start.cmd}:53:53/udp"
      - "${LOCAL_IP}:53:53/tcp"
    expose:
      - 53
    command:
      # Wildcard DNS entries for multi-worktree support
      # Matches: local.voxt.ai, wt1.local.voxt.ai, cdn-wt1.local.voxt.ai, etc.
      - --address=/.local.voxt.ai/${LOCAL_IP:-127.0.0.1}
      - --address=/.local.actual.chat/${LOCAL_IP:-127.0.0.1}
      - --address=/embedded.voxt.ai/${LOCAL_IP:-127.0.0.1}
      - --server=8.8.8.8
      - --server=1.1.1.1
  smtp4dev:
    image: rnwood/smtp4dev:3.2.0-ci20221023104
    ports:
      - "5080:80"
      - "25:25"
  nats:
    image: nats:2.11.4-alpine3.22
    expose:
      - 4222
    ports:
      - 4222:4222
      - 8222:8222
      - 8080:8080
    volumes:
      - ./.config/local.voxt.ai/nats:/etc/nats
    command:
      - "-js"
      - "--http_port"
      - "8222"
      - "--port"
      - "4222"
      - "-c"
      - "/etc/nats/nats-server.conf"
  seq:
    image: datalust/seq
    ports:
      - "8081:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
#    restart: unless-stopped
  # Chrome DevTools MCP instances. Each bridges stdio chrome-devtools-mcp to
  # streamable HTTP via supergateway. Two instances let us drive two Chromes
  # with separate cookie jars (e.g. `c chrome*2`) for multi-user UI tests.
  # Override CHROME_DEBUG_PORT_{1,2} in the environment or `.env` to rebind.
  chrome-devtools-mcp-1:
    <<: *chrome-devtools-mcp-base
    ports:
      - "8765:8765"
    environment:
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
      CHROME_DEBUG_PORT: "${CHROME_DEBUG_PORT_1:-9222}"

  chrome-devtools-mcp-2:
    <<: *chrome-devtools-mcp-base
    ports:
      - "8766:8765"
    environment:
      CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: "1"
      CHROME_DEBUG_PORT: "${CHROME_DEBUG_PORT_2:-9223}"
